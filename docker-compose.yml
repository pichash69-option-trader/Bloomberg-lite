# Bloomberg-lite — full stack: postgres+timescale, redis, backend, frontend
# Start:  docker compose up -d      Stop:  docker compose down
# Env comes from .env (see .env.example).

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: bl_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bloomberg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bloomberg}
      POSTGRES_DB: ${POSTGRES_DB:-bloomberg_lite}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bloomberg} -d ${POSTGRES_DB:-bloomberg_lite}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bl_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: bl_backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Live-reload during dev: mount source
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: bl_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
